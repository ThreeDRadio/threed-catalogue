<VirtualHost *:443>
    DocumentRoot "/var/www/html"
    ServerName threed-catalogue-server

    ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/ssl.crt/server.crt"
    SSLCertificateKeyFile "/etc/apache2/ssl/ssl.key/server.key"

    RewriteEngine On
    RewriteRule ^/threedfile/(.*)$   /database/download.php?xname=$1
    RewriteRule ^/database/play/(.*)$   /database/stream.php?xname=$1

    <Directory "/var/www/html">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>